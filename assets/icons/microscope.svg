<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="microscopeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Base -->
  <rect x="20" y="80" width="60" height="8" rx="4" fill="#34495e"/>
  
  <!-- Stand -->
  <rect x="45" y="60" width="10" height="20" fill="#34495e"/>
  
  <!-- Stage -->
  <rect x="35" y="55" width="30" height="8" rx="2" fill="#7f8c8d"/>
  
  <!-- Arm -->
  <rect x="40" y="25" width="8" height="35" fill="#34495e"/>
  
  <!-- Objective -->
  <circle cx="44" cy="50" r="6" fill="url(#microscopeGradient)"/>
  
  <!-- Eyepiece -->
  <circle cx="44" cy="20" r="8" fill="url(#microscopeGradient)"/>
  <circle cx="44" cy="20" r="4" fill="#ecf0f1"/>
  
  <!-- Focus knobs -->
  <circle cx="55" cy="40" r="3" fill="#e74c3c"/>
  <circle cx="55" cy="48" r="3" fill="#e74c3c"/>
  
  <!-- Light source -->
  <circle cx="44" cy="70" r="4" fill="#f39c12"/>
  <path d="M 40 66 L 48 66 L 48 74 L 40 74 Z" fill="#f1c40f" opacity="0.6"/>
</svg>