<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="cellGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e8f5e8;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#c8e6c9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4caf50;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="nucleusGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#ffcc02;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9800;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="organelleGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196f3;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Cell membrane -->
  <circle cx="50" cy="50" r="40" fill="url(#cellGradient)" stroke="#388e3c" stroke-width="2"/>
  
  <!-- Nucleus -->
  <circle cx="50" cy="50" r="18" fill="url(#nucleusGradient)" stroke="#f57c00" stroke-width="1.5"/>
  
  <!-- Nucleolus -->
  <circle cx="50" cy="50" r="8" fill="#e65100" opacity="0.7"/>
  
  <!-- Organelles -->
  <ellipse cx="30" cy="35" rx="6" ry="4" fill="url(#organelleGradient)" opacity="0.8"/>
  <ellipse cx="70" cy="40" rx="5" ry="3" fill="url(#organelleGradient)" opacity="0.8"/>
  <ellipse cx="35" cy="70" rx="4" ry="6" fill="url(#organelleGradient)" opacity="0.8"/>
  <ellipse cx="65" cy="65" rx="5" ry="4" fill="url(#organelleGradient)" opacity="0.8"/>
  
  <!-- Mitochondria -->
  <ellipse cx="25" cy="60" rx="8" ry="4" fill="#ff5722" opacity="0.6" transform="rotate(30 25 60)"/>
  <ellipse cx="75" cy="30" rx="7" ry="3" fill="#ff5722" opacity="0.6" transform="rotate(-45 75 30)"/>
  
  <!-- Endoplasmic reticulum -->
  <path d="M 20 45 Q 25 40 30 45 Q 35 50 40 45" stroke="#9c27b0" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 60 55 Q 65 50 70 55 Q 75 60 80 55" stroke="#9c27b0" stroke-width="2" fill="none" opacity="0.7"/>
  
  <!-- Ribosomes -->
  <circle cx="22" cy="42" r="1.5" fill="#795548"/>
  <circle cx="28" cy="48" r="1.5" fill="#795548"/>
  <circle cx="35" cy="43" r="1.5" fill="#795548"/>
  <circle cx="62" cy="52" r="1.5" fill="#795548"/>
  <circle cx="68" cy="58" r="1.5" fill="#795548"/>
  <circle cx="75" cy="53" r="1.5" fill="#795548"/>
</svg>