<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="analysisGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Monitor base -->
  <rect x="15" y="75" width="70" height="8" rx="4" fill="#34495e"/>
  <rect x="42" y="70" width="16" height="10" fill="#34495e"/>
  
  <!-- Monitor screen -->
  <rect x="20" y="20" width="60" height="50" rx="4" fill="url(#screenGradient)" stroke="#34495e" stroke-width="2"/>
  
  <!-- Screen content - data visualization -->
  <rect x="25" y="25" width="50" height="40" rx="2" fill="#ffffff"/>
  
  <!-- Chart axes -->
  <line x1="30" y1="60" x2="30" y2="30" stroke="#6c757d" stroke-width="2"/>
  <line x1="30" y1="60" x2="70" y2="60" stroke="#6c757d" stroke-width="2"/>
  
  <!-- Data points and trend line -->
  <circle cx="35" cy="55" r="2" fill="#e74c3c"/>
  <circle cx="40" cy="50" r="2" fill="#e74c3c"/>
  <circle cx="45" cy="45" r="2" fill="#e74c3c"/>
  <circle cx="50" cy="40" r="2" fill="#e74c3c"/>
  <circle cx="55" cy="35" r="2" fill="#e74c3c"/>
  <circle cx="60" cy="38" r="2" fill="#e74c3c"/>
  <circle cx="65" cy="42" r="2" fill="#e74c3c"/>
  
  <!-- Trend line -->
  <path d="M 35 55 L 40 50 L 45 45 L 50 40 L 55 35 L 60 38 L 65 42" 
        stroke="#3498db" stroke-width="2" fill="none"/>
  
  <!-- Bar chart in corner -->
  <rect x="50" y="50" width="3" height="8" fill="#27ae60"/>
  <rect x="54" y="45" width="3" height="13" fill="#f39c12"/>
  <rect x="58" y="40" width="3" height="18" fill="#9b59b6"/>
  <rect x="62" y="48" width="3" height="10" fill="#e67e22"/>
  
  <!-- Magnifying glass -->
  <circle cx="75" cy="35" r="8" fill="none" stroke="url(#analysisGradient)" stroke-width="3"/>
  <circle cx="75" cy="35" r="5" fill="rgba(102, 126, 234, 0.2)"/>
  <line x1="82" y1="42" x2="88" y2="48" stroke="url(#analysisGradient)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Analysis symbols -->
  <text x="76" y="38" font-family="Arial, sans-serif" font-size="8" fill="#667eea" text-anchor="middle">%</text>
</svg>