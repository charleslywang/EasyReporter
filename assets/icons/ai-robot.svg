<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="robotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="eyeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Robot head -->
  <rect x="25" y="25" width="50" height="40" rx="8" fill="url(#robotGradient)"/>
  
  <!-- Antenna -->
  <line x1="50" y1="25" x2="50" y2="15" stroke="#34495e" stroke-width="3"/>
  <circle cx="50" cy="12" r="3" fill="#e74c3c"/>
  
  <!-- Eyes -->
  <circle cx="38" cy="40" r="6" fill="url(#eyeGradient)"/>
  <circle cx="62" cy="40" r="6" fill="url(#eyeGradient)"/>
  <circle cx="38" cy="40" r="3" fill="#ffffff"/>
  <circle cx="62" cy="40" r="3" fill="#ffffff"/>
  
  <!-- Mouth -->
  <rect x="45" y="52" width="10" height="4" rx="2" fill="#34495e"/>
  
  <!-- Body -->
  <rect x="30" y="65" width="40" height="25" rx="5" fill="url(#robotGradient)"/>
  
  <!-- Arms -->
  <rect x="15" y="70" width="12" height="8" rx="4" fill="#34495e"/>
  <rect x="73" y="70" width="12" height="8" rx="4" fill="#34495e"/>
  
  <!-- Chest panel -->
  <rect x="40" y="72" width="20" height="15" rx="3" fill="#ecf0f1"/>
  <circle cx="45" cy="77" r="2" fill="#27ae60"/>
  <circle cx="50" cy="77" r="2" fill="#f39c12"/>
  <circle cx="55" cy="77" r="2" fill="#e74c3c"/>
  
  <!-- Circuit lines -->
  <line x1="42" y1="82" x2="58" y2="82" stroke="#3498db" stroke-width="1"/>
  <line x1="45" y1="84" x2="55" y2="84" stroke="#3498db" stroke-width="1"/>
</svg>