<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="15" y="15" width="70" height="70" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
  
  <!-- Grid lines -->
  <line x1="15" y1="25" x2="85" y2="25" stroke="#d5dbdb" stroke-width="1"/>
  <line x1="15" y1="35" x2="85" y2="35" stroke="#d5dbdb" stroke-width="1"/>
  <line x1="15" y1="45" x2="85" y2="45" stroke="#d5dbdb" stroke-width="1"/>
  <line x1="15" y1="55" x2="85" y2="55" stroke="#d5dbdb" stroke-width="1"/>
  <line x1="15" y1="65" x2="85" y2="65" stroke="#d5dbdb" stroke-width="1"/>
  <line x1="15" y1="75" x2="85" y2="75" stroke="#d5dbdb" stroke-width="1"/>
  
  <line x1="25" y1="15" x2="25" y2="85" stroke="#d5dbdb" stroke-width="1"/>
  <line x1="35" y1="15" x2="35" y2="85" stroke="#d5dbdb" stroke-width="1"/>
  <line x1="45" y1="15" x2="45" y2="85" stroke="#d5dbdb" stroke-width="1"/>
  <line x1="55" y1="15" x2="55" y2="85" stroke="#d5dbdb" stroke-width="1"/>
  <line x1="65" y1="15" x2="65" y2="85" stroke="#d5dbdb" stroke-width="1"/>
  <line x1="75" y1="15" x2="75" y2="85" stroke="#d5dbdb" stroke-width="1"/>
  
  <!-- Bar chart -->
  <rect x="22" y="60" width="6" height="20" fill="#3498db"/>
  <rect x="32" y="45" width="6" height="35" fill="#e74c3c"/>
  <rect x="42" y="35" width="6" height="45" fill="url(#chartGradient)"/>
  <rect x="52" y="50" width="6" height="30" fill="#f39c12"/>
  <rect x="62" y="25" width="6" height="55" fill="#9b59b6"/>
  <rect x="72" y="40" width="6" height="40" fill="#e67e22"/>
  
  <!-- Trend line -->
  <path d="M 25 65 L 35 50 L 45 40 L 55 55 L 65 30 L 75 45" 
        stroke="#e74c3c" stroke-width="3" fill="none" stroke-dasharray="2,2"/>
  
  <!-- Data points -->
  <circle cx="25" cy="65" r="3" fill="#e74c3c"/>
  <circle cx="35" cy="50" r="3" fill="#e74c3c"/>
  <circle cx="45" cy="40" r="3" fill="#e74c3c"/>
  <circle cx="55" cy="55" r="3" fill="#e74c3c"/>
  <circle cx="65" cy="30" r="3" fill="#e74c3c"/>
  <circle cx="75" cy="45" r="3" fill="#e74c3c"/>
</svg>